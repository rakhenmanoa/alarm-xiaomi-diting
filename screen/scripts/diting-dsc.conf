# Xiaomi diting : les dalles L12 attendent les 2 tranches DSC d'une ligne
# dans un seul paquet DSI (vendeur qcom,mdss-dsc-slice-per-pkt = 2). Requis
# par la dalle « 42 02 0a » (moitié gauche brouillée sinon), testé le
# 2026-10-26. Le pilote de dalle choisit lui-même sa table DSC.
options msm dsc_slice_per_pkt=2
