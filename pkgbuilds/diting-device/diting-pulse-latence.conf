# Xiaomi diting : latence minimale des clients PulseAudio de PipeWire.
#
# La capture passe par le DSP (q6apm) et ne tient pas de très petits blocs.
# Le test du micro de Plasma (plasma-pa) demande des fragments de 256 octets,
# soit environ 2,7 ms : toute la chaîne passait à 128 échantillons, avec des
# hachures, puis un plantage de plasma-settings (double libération d'un flux
# dans microphonetest.cpp, déclenchée par ce rythme irrégulier). Un minimum de
# 1024 échantillons (environ 21 ms) corrige les deux (testé le 2026-10-31).
pulse.properties = {
    pulse.min.req     = 1024/48000
    pulse.min.frag    = 1024/48000
    pulse.min.quantum = 1024/48000
}
