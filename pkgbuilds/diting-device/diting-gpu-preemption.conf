# Adreno 730 : préemption entre les anneaux de commandes désactivée.
# Avec la préemption (valeur par défaut du noyau 7.2 pour l'A730), le CP reste
# sur l'anneau 0 une fois vide et ne passe jamais à l'anneau 2 qui a du travail
# en attente : « gpu fault ring 2 … status 00E01007 », hangcheck, l'appli
# meurt (3DMark Wild Life via Waydroid, reproductible). Capture décodée avec
# crashdec : voir gpu/README.md §7. Testé le 2026-11-13.
options msm enable_preemption=0
