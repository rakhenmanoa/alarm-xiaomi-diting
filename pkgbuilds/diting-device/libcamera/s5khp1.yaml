# Xiaomi diting, caméra principale S5KHP1 (actionneur AK7314) : réglages du
# software ISP de libcamera. Autofocus par contraste : une mesure toutes
# les 4 images, passe grossière par pas de 10 (sur 0..100), puis deux
# mesures à +-4 et sommet de parabole.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
  - Awb:
  # Pas de calibration couleur : matrice identité, qui active la saturation
  # d'Adjust (le traitement GPU l'applique sans coût).
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  - Adjust:
      contrast: 1.15
      saturation: 1.25
  - Agc:
      exposureTarget: 2.0
  - Af:
      # le moteur bouge dès les statistiques reçues : une période de plus
      # (4 images) pour que la mesure suive vraiment la nouvelle position
      settleFrames: 1
      coarseStep: 10
      fineRange: 4
...
