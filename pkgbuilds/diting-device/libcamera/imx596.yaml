# Xiaomi diting, IMX596 (frontale) : réglages du software ISP de libcamera.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
  - Awb:
  # Pas de calibration couleur : matrice identité, qui active la saturation
  # d'Adjust (le traitement GPU l'applique sans coût).
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  - Adjust:
      contrast: 1.15
      saturation: 1.25
  - Agc:
      exposureTarget: 2.0
      # images de 50 ms au plus en basse lumière (20 i/s), le gain fait le reste
      maxFrameDuration: 50000
...
