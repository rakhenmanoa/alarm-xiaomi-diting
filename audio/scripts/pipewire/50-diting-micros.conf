# Xiaomi diting : choix du micro dans Plasma, sans changer de profil.
#
# Le device UCM « Mic » capture les deux micros en stéréo (hw:0,1) :
#   canal gauche (FL) = AMIC1 / ADC1 = micro du bas
#   canal droit  (FR) = AMIC5 / ADC4 = micro du haut
# Les deux ADC restent allumés ensemble (l'ADC4 seul bloque la capture).
# Ces deux sources mono prennent chacun un canal ; la source stéréo reste
# disponible. Le profil HiFi et le haut-parleur ne sont pas touchés.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Micro du bas"
            capture.props = {
                node.name = "capture.diting_micro_bas"
                audio.position = [ FL ]
                stream.dont-remix = true
                target.object = "alsa_input.platform-sound.HiFi__Mic__source"
                node.passive = true
            }
            playback.props = {
                node.name = "diting_micro_bas"
                media.class = "Audio/Source"
                audio.position = [ MONO ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Micro du haut"
            capture.props = {
                node.name = "capture.diting_micro_haut"
                audio.position = [ FR ]
                stream.dont-remix = true
                target.object = "alsa_input.platform-sound.HiFi__Mic__source"
                node.passive = true
            }
            playback.props = {
                node.name = "diting_micro_haut"
                media.class = "Audio/Source"
                audio.position = [ MONO ]
            }
        }
    }
]
