Syntax 4

# Xiaomi 12T Pro (diting): loudspeakers and earpiece via two CS35L41 on
# tertiary TDM, two analog microphones on a WCD938x via the LPASS TX macro.
SectionUseCase."HiFi" {
	File "/Qualcomm/sm8450/XIAOMI-DITING/HiFi.conf"
	Comment "Play HiFi quality Music"
}

# Media 6 dB below the level Android uses (817 = 0 dB). The PCM source
# (speaker protection DSP or plain ASP) is set by diting-speaker-protection.
BootSequence [
	cset "name='B Digital PCM Volume' 769"
	cset "name='T Digital PCM Volume' 769"
	cset "name='B Analog PCM Volume' 0"
	cset "name='T Analog PCM Volume' 0"
	cset "name='Top MUX' Speaker"
]
