# Xiaomi Diting: load the in-kernel PD mapper before the DSP loader.
#
# qcom_q6v5_pas creates the pd-mapper auxiliary device just before it starts
# each DSP; the driver behind it is a module that udev loads in parallel. When
# the ADSP (started first, ~7 s) asks for its service domains before
# qcom_pd_mapper is bound, it retries only after a long back-off: battery,
# charger and audio then appear after 50-300 s or not at all (battery reads
# 0 %, charging is not reported, no sound card).
softdep qcom_q6v5_pas pre: qcom_pd_mapper
