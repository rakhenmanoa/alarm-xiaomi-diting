# The SM8475 modem is part of the SoC and stays up while the host is
# suspended. ModemManager's default suspend handling removes all modems on
# suspend and re-scans on resume, but the re-scan does not find the QRTR
# modem again ("couldn't check support for device 'qcom-soc'"), so mobile
# data and calls are gone after the first suspend. Quick suspend/resume
# keeps the modem object and only re-syncs its state on resume.
[Service]
ExecStart=
ExecStart=/usr/sbin/ModemManager --test-quick-suspend-resume
